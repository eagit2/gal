name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  GODOT_VERSION: 4.5-stable

jobs:
  test-and-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and web export templates
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}
          curl -sSL -o godot.zip $base/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          curl -sSL -o templates.tpz $base/Godot_v${GODOT_VERSION}_export_templates.tpz
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION/-/.}
          mkdir -p $dest
          unzip -q -j templates.tpz 'templates/web_nothreads_*' 'templates/version.txt' -d $dest

      - name: Import
        run: godot --headless --import

      - name: Unit tests
        run: godot --headless -s res://tests/run_tests.gd

      - name: Smoke playthrough (stages 1-2, then challenge stage)
        run: |
          godot --headless --fixed-fps 60 -s res://tests/smoke_game.gd -- --seconds=45 2>&1 | tee smoke.log
          godot --headless --fixed-fps 60 -s res://tests/smoke_game.gd -- --stage=2 --seconds=25 2>&1 | tee -a smoke.log
          ! grep -E "SCRIPT ERROR|SMOKE FAIL" smoke.log

      - name: Export web build
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: build/web

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test-and-export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
